[project]
name = "aim-guardrail-gateway"
version = "0.1.0"
description = "OpenAI-compatible LLM gateway that enforces AIM guardrails on input and output"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic-settings>=2.4",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
redis = ["redis>=5.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["docs", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["UP042"]  # Verdict(str, Enum) is the fixed interface in DESIGN 8.1
